<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SmartSpaceAlarmBot</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Wirenboard.cloud</p>
          <h1>Статус объектов</h1>
        </div>
        <button class="icon-button" id="refreshButton" type="button" title="Обновить">
          <span aria-hidden="true">↻</span>
        </button>
      </header>

      <section class="summary-grid" aria-label="Сводка">
        <article class="summary-item" data-summary-filter="all" role="button" tabindex="0">
          <span class="summary-label">Всего</span>
          <strong id="totalCount">-</strong>
        </article>
        <article class="summary-item is-ok" data-summary-filter="online" role="button" tabindex="0">
          <span class="summary-label">В сети</span>
          <strong id="onlineCount">-</strong>
        </article>
        <article class="summary-item is-alert" data-summary-filter="offline" role="button" tabindex="0">
          <span class="summary-label">Не в сети</span>
          <strong id="offlineCount">-</strong>
        </article>
      </section>

      <nav class="view-tabs" aria-label="Разделы">
        <button class="view-tab is-active" type="button" data-view="status">Статус</button>
        <button class="view-tab" type="button" data-view="history">История</button>
        <button class="view-tab" type="button" data-view="settings">Настройки</button>
      </nav>

      <section class="view-panel" data-panel="status">
        <section class="toolbar" aria-label="Фильтры">
          <div class="segmented" role="tablist" aria-label="Фильтр статуса">
            <button class="segment is-active" type="button" data-filter="all">Все</button>
            <button class="segment" type="button" data-filter="offline">Упавшие</button>
            <button class="segment" type="button" data-filter="online">Онлайн</button>
          </div>
          <input id="searchInput" type="search" placeholder="Поиск по имени или serial" autocomplete="off" />
        </section>
        <section class="controller-list" id="controllerList" aria-live="polite"></section>
      </section>

      <section class="view-panel" data-panel="history" hidden>
        <section class="history-list" id="historyList"></section>
      </section>

      <section class="view-panel" data-panel="settings" hidden>
        <section class="settings-panel" aria-label="Настройки уведомлений">
          <div class="settings-row">
            <span>Тема уведомлений</span>
            <div class="segmented compact">
              <button class="segment" type="button" data-theme="dark">Темная</button>
              <button class="segment" type="button" data-theme="light">Светлая</button>
              <button class="segment" type="button" data-theme="matrix">Матрица</button>
            </div>
          </div>
          <div class="settings-row">
            <span>Уведомлять об offline через</span>
            <select id="delaySelect">
              <option value="0">сразу</option>
              <option value="300">5 минут</option>
              <option value="900">15 минут</option>
              <option value="1800">30 минут</option>
              <option value="3600">1 час</option>
            </select>
          </div>
        </section>
        <section class="settings-panel admin-panel" id="adminPanel" hidden>
          <div class="settings-row">
            <span>Пользователи</span>
            <div class="user-form">
              <input id="userInput" type="text" placeholder="@username или Telegram ID" autocomplete="off" />
              <button id="addUserButton" type="button">Добавить</button>
              <button id="removeUserButton" type="button">Удалить</button>
            </div>
          </div>
          <div class="user-list" id="userList"></div>
        </section>
      </section>

      <p class="status-line" id="statusLine">Загрузка...</p>
    </main>

    <template id="historyTemplate">
      <article class="history-item">
        <span class="history-status"></span>
        <div>
          <h2></h2>
          <p></p>
        </div>
      </article>
    </template>

    <template id="controllerTemplate">
      <article class="controller-card">
        <div class="controller-main">
          <span class="status-dot"></span>
          <div class="controller-text">
            <h2></h2>
            <p class="serial"></p>
            <p class="organization"></p>
            <p class="last-seen"></p>
          </div>
        </div>
        <a class="open-link" target="_blank" rel="noreferrer">Открыть</a>
      </article>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
